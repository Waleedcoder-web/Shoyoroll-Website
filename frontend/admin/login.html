<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login | BLUENEEDLE</title>
  <meta name="description" content="BLUENEEDLE Administrative Portal Sign In" />
  <meta name="robots" content="noindex, nofollow" />
  
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  
  <!-- Fonts: Inter & Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet" />
  
  <!-- Global Styles -->
  <link rel="stylesheet" href="/css/styles.css" />

  <!-- Self-Contained Complete Styles (Zero dependencies on Tailwind purge) -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #0b1329;
      background: radial-gradient(circle at 50% 0%, #15284f 0%, #080e1e 100%);
      color: #0f172a;
    }

    .brand-font {
      font-family: 'Montserrat', sans-serif;
    }

    /* Top navigation bar */
    .top-nav {
      width: 100%;
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
    }

    .brand-logo-img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    .brand-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: #ffffff;
    }

    .brand-accent {
      color: #00b4d8;
    }

    .website-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.875rem;
      border-radius: 0.375rem;
      font-size: 0.8125rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.75);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .website-back-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* Main login card */
    .login-container {
      width: 100%;
      max-width: 440px;
      margin: 1rem auto;
      padding: 0 1.25rem;
    }

    .login-card {
      background: #ffffff;
      border-radius: 1rem;
      padding: 2.25rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 35px rgba(0, 180, 216, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .card-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .center-logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 68px;
      border-radius: 1rem;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 1rem;
    }

    .center-logo-img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .card-brand-name {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #0f172a;
      line-height: 1.2;
    }

    .card-subtitle {
      font-size: 0.8125rem;
      color: #64748b;
      margin-top: 0.35rem;
      font-weight: 500;
    }

    /* Form controls */
    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #1e293b;
      margin-bottom: 0.5rem;
    }

    .input-field-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .input-icon-left {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: #94a3b8;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-input {
      width: 100%;
      height: 46px;
      padding: 0 14px 0 42px;
      font-size: 0.875rem;
      font-family: inherit;
      color: #0f172a;
      background-color: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 0.5rem;
      outline: none;
      transition: all 0.15s ease;
    }

    .form-input:focus {
      border-color: #0077b6;
      box-shadow: 0 0 0 3px rgba(0, 119, 182, 0.18);
    }

    .form-input.password-input {
      padding-right: 48px;
    }

    /* SINGLE EYE BUTTON - NO DOUBLE EYE */
    .password-eye-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: 0.375rem;
      color: #64748b;
      cursor: pointer;
      transition: all 0.15s ease;
      padding: 0;
    }

    .password-eye-btn:hover {
      color: #0f172a;
      background-color: #f1f5f9;
    }

    .password-eye-btn svg {
      width: 19px;
      height: 19px;
      display: block;
    }

    /* Error Message Box */
    .error-box {
      display: none;
      align-items: flex-start;
      gap: 0.625rem;
      padding: 0.75rem 0.875rem;
      border-radius: 0.5rem;
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      font-size: 0.8125rem;
      line-height: 1.4;
      margin-bottom: 1.25rem;
    }

    .error-box.show {
      display: flex;
    }

    /* Submit Button */
    .submit-button {
      width: 100%;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: #0f172a;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.2);
      transition: all 0.2s ease;
      margin-top: 0.75rem;
    }

    .submit-button:hover {
      background-color: #0077b6;
      box-shadow: 0 6px 10px -1px rgba(0, 119, 182, 0.3);
    }

    .submit-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* Loading Spinner */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-spinner.active {
      display: inline-block;
    }

    /* Card Footer */
    .card-footer {
      margin-top: 1.75rem;
      padding-top: 1rem;
      border-top: 1px solid #f1f5f9;
      text-align: center;
      font-size: 0.75rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.375rem;
    }

    .page-footer {
      padding: 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
    }
  </style>

  <!-- Auth Script (handles redirect if already logged in) -->
  <script src="/js/auth.js"></script>
</head>
<body>

  <!-- Top Bar -->
  <header class="top-nav">
    <a href="/" class="brand-link">
      <img src="/assets/logo.png" alt="BLUENEEDLE" class="brand-logo-img" />
      <span class="brand-title">
        BLUE<span class="brand-accent">NEEDLE</span>
      </span>
    </a>
    <a href="/" class="website-back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
      Return to Store
    </a>
  </header>

  <!-- Login Card Container -->
  <main class="login-container">
    <div class="login-card">
      
      <!-- Card Header: Brand Logo & Title -->
      <div class="card-header">
        <div class="center-logo-wrap">
          <img src="/assets/logo.png" alt="BLUENEEDLE" class="center-logo-img" />
        </div>
        <h1 class="card-brand-name">BLUE<span class="brand-accent">NEEDLE</span></h1>
        <p class="card-subtitle">BJJ Fightwear Manufacturer &bull; Admin Portal</p>
      </div>

      <!-- Error Box -->
      <div id="login-error" class="error-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; margin-top:1px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="login-error-text">Invalid username or password.</span>
      </div>

      <!-- Login Form -->
      <form id="login-form">
        <!-- Username -->
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <div class="input-field-wrapper">
            <span class="input-icon-left">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input
              id="username"
              name="username"
              type="text"
              class="form-input"
              required
              autocomplete="username"
              placeholder="Username (e.g. Waleed)"
              autofocus
            />
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-field-wrapper">
            <span class="input-icon-left">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input
              id="password"
              name="password"
              type="password"
              class="form-input password-input"
              required
              autocomplete="current-password"
              placeholder="Password"
            />
            <!-- Single Eye Button (Swaps icon via JS, zero CSS conflicts) -->
            <button
              type="button"
              id="toggle-password"
              class="password-eye-btn"
              title="Show password"
              aria-label="Toggle password visibility"
            >
              <span id="eye-icon-container">
                <!-- Eye Open Icon (Default) -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </span>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submit-btn" class="submit-button">
          <span id="btn-spinner" class="loading-spinner"></span>
          <span id="btn-text">Sign In</span>
        </button>
      </form>

      <!-- Security Guarantee -->
      <div class="card-footer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>Secured with Bcrypt Encryption &amp; JWT</span>
      </div>
    </div>
  </main>

  <!-- Page Footer -->
  <footer class="page-footer">
    &copy; 2026 BLUENEEDLE. Sialkot, Pakistan. Authorized personnel only.
  </footer>

  <!-- Single-Icon Eye Toggle & Login Handling -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('login-form');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const submitBtn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');
      const errorDiv = document.getElementById('login-error');
      const errorText = document.getElementById('login-error-text');
      const togglePasswordBtn = document.getElementById('toggle-password');
      const eyeContainer = document.getElementById('eye-icon-container');

      // Eye SVG definitions (Ensures strictly ONE icon exists at all times)
      const eyeOpenSvg = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      `;

      const eyeClosedSvg = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
          <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
          <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
          <line x1="2" y1="2" x2="22" y2="22"/>
        </svg>
      `;

      // Password visibility toggle
      let isPasswordVisible = false;
      togglePasswordBtn.addEventListener('click', (e) => {
        e.preventDefault();
        isPasswordVisible = !isPasswordVisible;
        passwordInput.type = isPasswordVisible ? 'text' : 'password';
        eyeContainer.innerHTML = isPasswordVisible ? eyeClosedSvg : eyeOpenSvg;
        togglePasswordBtn.title = isPasswordVisible ? 'Hide password' : 'Show password';
        passwordInput.focus();
      });

      // Submit handler
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorDiv.classList.remove('show');
        submitBtn.disabled = true;
        btnSpinner.classList.add('active');
        btnText.textContent = 'Verifying...';

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const data = await res.json();

          if (res.ok && data.success && data.token) {
            localStorage.setItem('blueneedle_admin_token', data.token);
            localStorage.setItem('blueneedle_admin_user', JSON.stringify(data.user));
            window.location.replace('/admin/index.html');
          } else {
            errorText.textContent = data.error?.message || 'Invalid username or password.';
            errorDiv.classList.add('show');
            passwordInput.value = '';
            passwordInput.focus();
          }
        } catch (err) {
          console.error('Login error:', err);
          errorText.textContent = err.message || 'Unable to connect to the backend server. Please check database connection.';
          errorDiv.classList.add('show');
        } finally {
          submitBtn.disabled = false;
          btnSpinner.classList.remove('active');
          btnText.textContent = 'Sign In';
        }
      });
    });
  </script>
</body>
</html>
